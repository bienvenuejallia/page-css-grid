<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Mise en page responsive avec CSS Grid">
  <meta name="keywords" content="HTML, CSS, Grid, Responsive Design">
  <meta name="author" content="Dimi Bienvenue Jallia">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page CSS Grid</title>

  <link href="https://fonts.googleapis.com/css2?family=Merriweather&display=swap" type rel="stylesheet">

   <style>
        :root {
        --jaune: #f5e28b;
        --jaune-transparent: #f5e28bca;
        --bleu: rgb(193, 193, 254);
        --jaune-clair: #ffe066;
        }

        * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Merriweather', serif;
        }

        html, body {
        padding:0;
        margin:0;
        background:#999;
        width:100vw;
        min-height:100vh;
        scroll-behavior: smooth;
        }

        body {
        background: linear-gradient(-45deg, #e3ffe7, #d9e7ff, #ffe3e3, #f9f1ff);
        background-size: 400% 400%;
        animation: bgScroll 15s ease infinite;
        }

        @keyframes bgScroll {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
        }
        /* format desktop*/
        .container {
        display: grid;
        grid-template-areas: 
            "entete entete entete"
            "navigation contenu complement"
            "pieddepage pieddepage pieddepage";
        grid-template-columns: minmax(100px, 1fr) 2fr minmax(100px, 1fr);
        grid-template-rows: minmax(10vh, auto) 1fr minmax(10vh, auto);
        gap: 10px;
        padding: 10px;
        height: 100vh;
        background-color: #4f4f4f7b;
        font-size: 12px;
        max-width: 100vw;
        max-height: 100vh;
        }
        .container > * {
        border: 2px solid #ffffff50;
        border-radius: 5px;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 4px 4px rgba(0,0,0,0.2);
        text-shadow: 1px 1px 1px #fff, 2px 2px 4px rgba(0,0,0,0.2);
        backdrop-filter: blur(2px);
        animation: fadeIn 0.8s ease-in-out;
        transition: all 0.3s ease;
        position: relative;
        }

        @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
        }

        .container > *:hover {
        filter: brightness(1.03);
        }

        .container > *::after {
        content: "";
        display: block;
        height: 3px;
        width: 100%;
        margin-top: 10px;
        border-radius: 0 0 5px 5px;
        background: linear-gradient(to right, #ffffff50, #00000020);
        }

        header {
        grid-area: entete;
        background-color: var(--jaune);
        padding: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: bold;
        text-align: left;
        }

        nav {
        grid-area: navigation;
        background-color: var(--bleu);
        padding: 5px;
        line-height: 1.6;
        text-align: left;
        }

        article {
        grid-area: contenu;
        background-color: rgba(255, 255, 0, 0.379);
        padding: 10px;
        font-size: 12px;
        text-indent: 20px;
        line-height: 1.7;
        animation: float 5s ease-in-out infinite;
        text-align: left;
        }

        @keyframes float {
        0% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0); }
        }

        aside {
        grid-area: complement;
        background-color: var(--bleu);
        padding: 0px;
        margin: 0px;
        text-align: left;
        }

        footer {
        grid-area: pieddepage;
        background-color: var(--jaune-transparent);
        padding: 10px;
        font-size: 12px;
        font-size: small;
        text-transform: capitalize;
        border-top: 2px dashed rgba(0, 0, 0, 0.2);
        text-align: left;
        }

        ::selection {
        background: var(--jaune-clair);
        color: black;
        }

        header:focus, nav:focus, article:focus, aside:focus, footer:focus {
        outline: 3px dashed #ffcc00;
        outline-offset: 5px;
        }

        @media only screen and (min-width: 1025px) {
        header:hover, nav:hover, article:hover, aside:hover, footer:hover {
            transform: scale(1.02);
        }
        }

        /*format mobile*/

        @media only screen and (max-width: 768px) {
        .container {
            display: grid;
            flex-direction: column;
            gap: 10px;
            padding: 7px;
            margin: auto;
            width: 100%;
            max-width: 100%;
            grid-template-areas: 
            "entete"
            "contenu"
            "navigation"
            "complement"
            "pieddepage";
            grid-template-columns: repeat(1, minmax(200px, 1fr));
            grid-template-rows: auto auto auto auto auto;
        }

        header, nav, aside, footer {
            background-color: var(--jaune-transparent);
            font-size: 10px;
            text-align: left;
            padding: 5px;
            margin: 1px;
            height: 90px;
            max-width: 700px;
            box-shadow: 0 4px 4px rgba(0, 0, 0, 0.1);
        }

        article {
            padding: 150px;
            background-color: rgba(255, 255, 0, 0.379);
            text-align: left;
        }

        nav, aside {
            background-color: var(--bleu);
        }
        }

        /*format tablette*/

        @media only screen and (max-width: 1024px) {
        .container {
            display: grid;
            padding: 10px;
            margin: 0 auto;
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            gap: 10px;
            grid-template-areas: 
            "entete"
            "contenu"
            "navigation"
            "complement"
            "pieddepage";
            grid-template-columns: repeat(1, minmax(300px, 1fr));
            grid-template-rows: 60px auto 80px 80px 60px;
        }

        header, nav, aside, footer, article {
            font-size: 10px;
            padding: 15px;
            box-shadow: 0 4px 5px rgba(0, 0, 0, 0.1);
            max-width: 100%;
            text-align: left;
        }

        header, footer {
            background-color: var(--jaune);
            height: 60px;
            text-align: left;
        }

        nav, aside {
            background-color: var(--bleu);
            height: 80px;
        }

        article {
            background-color: rgba(255, 255, 0, 0.379);
            text-align: left;
        }
        }

        html {
        scroll-snap-type: y mandatory;
        }

        .container > * {
        scroll-snap-align: start;
        }

        article {
        line-height: 1.8;
        letter-spacing: 0.3px;
        word-spacing: 1px;
        hyphens: auto;
        text-align: justify;
        }

        .container > *:hover::before {
        content: " ";
        position: absolute;
        top: 5px;
        right: 10px;
        font-size: 10px;
        font-style: italic;
        color: #222;
        opacity: 0.5;
        }

        .grid-auto {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        }

        header:focus-visible,
        nav:focus-visible,
        article:focus-visible,
        aside:focus-visible,
        footer:focus-visible {
        outline: 2px dotted #222;
        outline-offset: 4px;
        }

                
            
   </style>
</head>
<body>
  <div class="container">
    <header>Header</header>
    <nav>Navigation</nav>
    <article>Article</article>
    <aside>Aside</aside>
    <footer>Footer</footer>
  </div>
</body>
</html>
