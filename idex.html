<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>FilmDB - User Interface</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background-color:#1F2937;
      font-family: 'Segoe UI', sans-serif;
      color: #333;
    }

    h1, h2 {
      text-align: center;
      color: whitesmoke;
    }

    .form {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    input {
      width: 160px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }

    button {
      padding: 10px 16px;
      background-color: #3498db;
      border: none;
      border-radius: 5px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #2980b9;
    }

    .film {
      background-color: white;
      max-width: 600px;
      margin: 10px auto;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .film strong {
      font-size: 18px;
      color: #222;
    }
  </style>
</head>
<body>

  <h1>Ajouter un film</h1>

  <!-- Formulaire pour saisir les informations du film -->
  <div class="form">
    <input id="titre" placeholder="Titre du film" />
    <input id="annee" type="number" placeholder="Année" />
    <input id="realisateur" placeholder="Réalisateur" />
    <input id="genre" placeholder="Genre" />
    <input id="note" type="number" placeholder="Note / 5" />
    <button onclick="ajouterFilm()">Ajouter</button>
  </div>

  <h2>Films enregistrés</h2>
  <div id="films"></div>

  <script>
    // Fonction pour charger tous les films depuis l'API
    async function chargerFilms() {
      const res = await fetch('/films');
      const films = await res.json();
      const zoneFilms = document.getElementById('films');
      zoneFilms.innerHTML = '';

      films.forEach(film => {
        zoneFilms.innerHTML += `
          <div class="film">
            <strong>${film.titre}</strong> (${film.annee})<br />
            Réalisé par : ${film.realisateur}<br />
            Genre : ${film.genre} — Note : ${film.note}/5
          </div>
        `;
      });
    }

    // Fonction pour ajouter un film à la base via l'API
    async function ajouterFilm() {
      const film = {
        titre: document.getElementById('titre').value,
        annee: parseInt(document.getElementById('annee').value),
        realisateur: document.getElementById('realisateur').value,
        genre: document.getElementById('genre').value,
        note: parseInt(document.getElementById('note').value)
      };

      await fetch('/films', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(film)
      });

      chargerFilms(); // Mise à jour de la liste
    }

    // Chargement automatique des films au démarrage
    chargerFilms();
  </script>
</body>
</html>
